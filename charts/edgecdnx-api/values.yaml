replicaCount: 2
image:
  repository: fr6nco/edgecdnx-api
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext: {}
service:
  type: ClusterIP
  port: 5555

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}
args:
  - --listen=0.0.0.0:5555
  - --namespace=edgecdnx
  - --prometheus_endpoint=edgecdnx-monitoring-kube-p-prometheus.monitoring.svc.cluster.local:9090
  - --production
livenessProbe:
  httpGet:
    path: /health
    port: http
readinessProbe:
  httpGet:
    path: /health
    port: http

volumes: []
volumeMounts: []
nodeSelector: {}

tolerations: []

affinity: {}

# Live location healthchecks are read from the healthchecker TimescaleDB.
# Provide the connection string via HEALTHCHECK_DB_DSN (or the --healthcheck_db_dsn arg), e.g.:
# env:
#   - name: HEALTHCHECK_DB_DSN
#     valueFrom:
#       secretKeyRef:
#         name: healthchecks-db
#         key: dsn # postgres://user:pass@host:5432/app?sslmode=require
env: []

# Stripe billing. Also requires `billing` in --feature-gates (args) and --namespaced=true.
billing:
  enabled: false
  # Secret providing STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET.
  existingSecret: ""
  # Rendered to /etc/edgecdnx/billing.yaml. URLs may contain {project}.
  config: {}
  #   checkoutSuccessURL: https://app.example.com/projects/{project}/billing?checkout=success
  #   checkoutCancelURL: https://app.example.com/projects/{project}/billing?checkout=cancel
  #   portalReturnURL: https://app.example.com/projects/{project}/billing
  #   exemptProjects: [admin]
  #   tiers:
  #     - name: free
  #       displayName: Free
  #       stripePriceLookupKey: edgecdnx_free_monthly
  #       quota:
  #         count/zones.infrastructure.edgecdnx.com: "2"
  #         count/dnsendpoints.infrastructure.edgecdnx.com: "100"
  #     - name: business
  #       displayName: Business
  #       stripePriceLookupKey: edgecdnx_business_monthly
  #       quota:
  #         count/zones.infrastructure.edgecdnx.com: "10"
  #         count/dnsendpoints.infrastructure.edgecdnx.com: "5000"
  #     - name: enterprise
  #       displayName: Enterprise
  #       stripePriceLookupKey: edgecdnx_enterprise_monthly
  #       quota:
  #         count/zones.infrastructure.edgecdnx.com: "50"
