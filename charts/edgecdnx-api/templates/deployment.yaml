apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edgecdnx-api.fullname" . }}
  labels:
    {{- include "edgecdnx-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "edgecdnx-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.podAnnotations .Values.billing.enabled }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.billing.enabled }}
        checksum/billing-config: {{ toYaml .Values.billing.config | sha256sum }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "edgecdnx-api.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "edgecdnx-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          command: 
            - /edgecdnx-api
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.billing.enabled }}
          envFrom:
            - secretRef:
                name: {{ required "billing.existingSecret is required when billing is enabled" .Values.billing.existingSecret }}
          {{- end }}
          {{- if or .Values.args .Values.featureGates .Values.billing.enabled }}
          args:
            {{- with .Values.args }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.featureGates }}
            - {{ printf "--feature-gates=%s" (join "," .) | quote }}
            {{- end }}
            {{- if .Values.billing.enabled }}
            - --billing_config=/etc/edgecdnx/billing.yaml
            {{- end }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.volumeMounts .Values.billing.enabled }}
          volumeMounts:
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if .Values.billing.enabled }}
            - name: billing-config
              mountPath: /etc/edgecdnx
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes .Values.billing.enabled }}
      volumes:
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if .Values.billing.enabled }}
        - name: billing-config
          configMap:
            name: {{ include "edgecdnx-api.fullname" . }}-billing
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
