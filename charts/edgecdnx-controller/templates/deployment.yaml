apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edgecdnx-controller.fullname" . }}
  labels:
    {{- include "edgecdnx-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "edgecdnx-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "edgecdnx-controller.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "edgecdnx-controller.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if eq "true" .Values.webhook.enabled }}
          ports:
            - containerPort: 9443
              name: webhook-server
              protocol: TCP
          {{- else }}
          ports: []
          {{- end }}
          env:
            - name: ENABLE_WEBHOOKS
              value: "{{ .Values.webhook.enabled }}"
          command:
            - /manager
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
          {{- with .Values.role }}
            - --role={{ . }}
          {{- end }}
          {{- if eq .Values.role "downstream" }}
            - --target={{ required "downstream.target is required when role is downstream" .Values.downstream.target }}
            - --upstream-kubeconfig=/var/run/edgecdnx/upstream/kubeconfig
            - --downstream-workers={{ .Values.downstream.workers }}
            - --downstream-client-qps={{ .Values.downstream.clientQPS }}
            - --downstream-client-burst={{ .Values.downstream.clientBurst }}
          {{- end }}
          {{- with .Values.consulEndpoint }}
            - --consul-endpoint={{ . }}
          {{- end }}
          {{- with .Values.targetNamespace }}
            - --infrastructure-target-namespace={{ . }}
          {{- end }}
          {{- if eq "true" .Values.webhook.enabled }}
            - --webhook-cert-path=/certs/webhook
          {{- end }}
          {{- if eq "true" .Values.probes.enabled }}
            - --manage-monitoring-probes=true
            - --location-probe-prober-url={{ .Values.probes.probeUrl }}
            - --monitoring-release-label={{ .Values.probes.releaseLabel }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or (eq "true" .Values.webhook.enabled) (eq .Values.role "downstream") }}
          volumeMounts:
            {{- if eq "true" .Values.webhook.enabled }}
            - name: webhook-certs
              mountPath: /certs/webhook
              readOnly: true
            {{- end }}
            {{- if eq .Values.role "downstream" }}
            - name: upstream-kubeconfig
              mountPath: /var/run/edgecdnx/upstream
              readOnly: true
            {{- end }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or (eq "true" .Values.webhook.enabled) (eq .Values.role "downstream") }}
      volumes:
        {{- if eq "true" .Values.webhook.enabled }}
        - name: webhook-certs
          secret:
            secretName: {{ include "edgecdnx-controller.fullname" . }}-tls
        {{- end }}
        {{- if eq .Values.role "downstream" }}
        - name: upstream-kubeconfig
          secret:
            secretName: {{ required "downstream.kubeconfigSecretName is required when role is downstream" .Values.downstream.kubeconfigSecretName }}
            items:
              - key: {{ .Values.downstream.kubeconfigSecretKey | quote }}
                path: kubeconfig
        {{- end }}
      {{- end }}
